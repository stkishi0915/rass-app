<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RASSパートナー - 吃音リカバリー伴走システム</title>
  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Noto Sans JP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #fdfbf7;
    }
    /* カスタムスクロールバー非表示 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 音声波形シミュレーターのアニメーション */
    @keyframes wavePlay {
      0%, 100% { transform: scaleY(0.2); }
      50% { transform: scaleY(1.0); }
    }
    .wave-bar {
      animation: wavePlay 1.2s ease-in-out infinite;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { animation-delay: 0.45s; }
    .wave-bar:nth-child(5) { animation-delay: 0.6s; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- ヘッダー：ステップ付きロードマップ -->
  <header class="bg-white border-b border-rose-100 shadow-sm sticky top-0 z-50 px-4 py-3">
    <div class="max-w-md mx-auto">
      <div class="flex items-center justify-between text-[11px] font-bold text-slate-400 mb-1.5">
        <span class="text-rose-600 flex items-center gap-1">🌸 RASSパートナー</span>
        <span id="roadmap-progress">Step 1 / 11</span>
      </div>
      <!-- 11ステップインジケーター -->
      <div class="flex items-center justify-between relative mt-1">
        <div class="absolute left-0 right-0 top-1/2 h-[3px] bg-slate-100 -translate-y-1/2 z-0 rounded-full"></div>
        <div id="roadmap-line" class="absolute left-0 top-1/2 h-[3px] bg-rose-400 -translate-y-1/2 z-0 transition-all duration-300 rounded-full" style="width: 0%;"></div>
        
        <div class="flex items-center justify-between w-full relative z-10">
          <script>
            for (let i = 1; i <= 11; i++) {
              document.write(`
                <div id="dot-${i}" class="w-6 h-6 rounded-full bg-white border-2 border-slate-200 flex items-center justify-center text-[10px] font-black text-slate-400 transition-all duration-300 shadow-xs">
                  ${i}
                </div>
              `);
            }
          </script>
        </div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 w-full max-w-md mx-auto px-4 py-6 flex flex-col justify-start">
    
    <!-- さくら先生メッセージ吹き出し -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-rose-50 flex items-start gap-3.5 mb-5">
      <div class="w-11 h-11 rounded-full bg-rose-50 flex items-center justify-center text-xl shrink-0 border border-rose-100 shadow-inner">🌸</div>
      <div class="flex-1 min-w-0">
        <h3 class="text-xs font-bold text-rose-500 mb-0.5">担当ST：さくら先生</h3>
        <p id="sakura-bubble" class="text-xs leading-relaxed text-slate-700 font-medium">
          はじめまして！言語聴覚士のさくらです。あなた本来の「自然でリラックスしたお話し方」を一緒にゆっくり取り戻していきましょうね。よろしくお願いいたします。
        </p>
      </div>
    </div>

    <!-- メイン表示カード -->
    <div id="step-content" class="bg-white rounded-3xl p-6 shadow-xs border border-slate-100 min-h-[420px] flex flex-col justify-between transition-all duration-300">
      <!-- 動的ロード -->
    </div>

  </main>

  <!-- 固定フッター：ナビゲーションボタン -->
  <footer class="bg-white border-t border-slate-100 p-4 sticky bottom-0 z-40">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <button id="btn-back" onclick="prevStep()" class="px-5 py-3 rounded-2xl font-bold text-sm bg-slate-50 text-slate-500 hover:bg-slate-100 active:scale-95 transition disabled:opacity-40" disabled>
        戻る
      </button>
      <button id="btn-next" onclick="nextStep()" class="flex-1 py-3 rounded-2xl font-bold text-sm bg-rose-500 text-white shadow-md shadow-rose-200/50 hover:bg-rose-600 active:scale-95 transition disabled:bg-slate-100 disabled:text-slate-400 disabled:shadow-none">
        次に進む
      </button>
    </div>
  </footer>

  <!-- カスタムモーダル（alert等のブラウザ標準UIの代替） -->
  <div id="custom-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center hidden px-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-xl border border-slate-100">
      <h3 id="modal-title" class="text-sm font-bold text-slate-800 mb-2">確認</h3>
      <p id="modal-message" class="text-xs text-slate-500 leading-relaxed mb-5"></p>
      <div class="text-right">
        <button onclick="closeModal()" class="px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold rounded-xl transition">確定</button>
      </div>
    </div>
  </div>

  <script>
    // 状態管理
    const state = {
      currentStep: 1,
      profile: {
        name: '',
        age: '',
        belonging: '',
        familyHistory: 'unknown',
        trainingHistory: 'no',
        trainingDetails: '',
        motherName: 'お母さん',
        fatherName: 'お父さん'
      },
      selfSurvey: {
        effort: 5,
        rating: 5,
        satisfaction: 2
      },
      currentQuestionIndex: 0,
      answers: {}, // questionId: score
      mrProgress: {}, // s_id: count
      audioPlaying: false,
      audioTime: 0,
      audioInterval: null,
      attentionShiftChecked: [false, false, false, false]
    };

    // 悪循環チェックシート全55項目
    const allQuestions = [
      { id: 1, cat: "他者の推測", text: "吃ると他の人は笑うに違いない。" },
      { id: 2, cat: "他者の推測", text: "吃ると他の人は変な話し方だと思っている。" },
      { id: 3, cat: "他者の推測", text: "吃る人は劣っていると他の人は考えている。" },
      { id: 4, cat: "他者の推測", text: "皆が自分の話し方に注目している。" },
      { id: 5, cat: "自分への考え", text: "吃ることは恥ずかしいことである。" },
      { id: 6, cat: "自分への考え", text: "吃ることはいけないことである。" },
      { id: 7, cat: "自分への考え", text: "吃ることは変な話し方である。" },
      { id: 8, cat: "自分への考え", text: "吃ると他の人から笑われるに違いない。" },
      { id: 9, cat: "自分への考え", text: "吃ると馬鹿にされるに違いない。" },
      { id: 10, cat: "孤立感", text: "他の人には知られたくない。" },
      { id: 11, cat: "孤立感", text: "吃るのは自分だけだ。" },
      { id: 12, cat: "発話への考え", text: "話すとは意識して言葉を出すことである。" },
      { id: 13, cat: "発話への考え", text: "話すとは口を動かして声を出すことである。" },
      { id: 14, cat: "発話への考え", text: "特定の場面では言うべき表現が決まっていると思う。（セリフ、シナリオ）。" },
      { id: 15, cat: "自己認識", text: "自分は普通の話し方ができない人である。" },
      { id: 16, cat: "自己認識", text: "自分は劣った（駄目な）人である。" },
      { id: 17, cat: "自己認識", text: "自分は価値が低い人だ。" },
      { id: 18, cat: "自己認識", text: "今の自分は嫌だ。" },
      { id: 19, cat: "自己認識", text: "自分は健常者でないから駄目だ。" },
      { id: 20, cat: "自己認識", text: "自分はコミュニケーションが下手な人だ。" },
      { id: 21, cat: "感情・情動", text: "吃って悔やむ（後悔）。" },
      { id: 22, cat: "感情・情動", text: "吃ると恥ずかしい。" },
      { id: 23, cat: "感情・情動", text: "吃ることが辛い。" },
      { id: 24, cat: "感情・情動", text: "吃ることが悲しい。" },
      { id: 25, cat: "感情・情動", text: "個別の場面・条件下で吃るかもしれないと不安である（不安、恐怖感）。" },
      { id: 26, cat: "感情・情動", text: "全般的な、また吃るかもしれないと不安である。" },
      { id: 27, cat: "感情・情動", text: "自分は孤独であり、寂しい。" },
      { id: 28, cat: "注目・監視", text: "発話前に、語音（言葉の音）に注目している。" },
      { id: 29, cat: "注目・監視", text: "発話前に、発話中に言葉に注目している。" },
      { id: 30, cat: "注目・監視", text: "発話前に、言える、言えないと判断する。" },
      { id: 31, cat: "注目・監視", text: "発話前または発話中に口、舌の状態に注意が向く。" },
      { id: 32, cat: "注目・監視", text: "発話前または発話中に自分の身体の状態を感じている。" },
      { id: 33, cat: "注目・監視", text: "発話後、上手く言えた、言えなかったと分析する（発話結果が気になる）。" },
      { id: 34, cat: "注目・監視", text: "自分の話し方への他者の反応が気になる。" },
      { id: 35, cat: "注目・監視", text: "発話時、その前後に緊張、不安へ注意を向ける。" },
      { id: 36, cat: "目的化", text: "上手く話そうと意識する（目的化）。" },
      { id: 37, cat: "目的化", text: "話そうと（話す事自体を）意図的に考える。" },
      { id: 38, cat: "目的化", text: "言葉を出そうと意図している（言葉を意識的に出そうとしている）。" },
      { id: 39, cat: "工夫（制御）", text: "発話中に舌、口、呼吸器官の動きを意識的に行おうとする。" },
      { id: 40, cat: "工夫（制御）", text: "発話中に、口を意図的に大きく動かし話す。" },
      { id: 41, cat: "工夫（制御）", text: "口の形を自分が言いやすいように工夫する。" },
      { id: 42, cat: "工夫（制御）", text: "口を大きく開けて話す。" },
      { id: 43, cat: "工夫（制御）", text: "お腹に力を入れて話す（お腹から声を出す）。" },
      { id: 44, cat: "工夫（制御）", text: "息をゆっくり吐きながら話す。" },
      { id: 45, cat: "工夫（制御）", text: "他の人には分からない様にリズムを取って話す。" },
      { id: 46, cat: "工夫（制御）", text: "速度を落として、ゆっくり話す。" },
      { id: 47, cat: "工夫（制御）", text: "発話前に息を深く吸う。" },
      { id: 48, cat: "工夫（制御）", text: "息を少し吐いてから（途中まで吐いてから）話す。" },
      { id: 49, cat: "工夫（制御）", text: "話す直前に、口を少し動かして言い易くする。" },
      { id: 50, cat: "工夫（回避）", text: "もう一度言わなければならない時は言わない。" },
      { id: 51, cat: "工夫（回避）", text: "吃りそうな時は、分からないふりをして言わない。" },
      { id: 52, cat: "工夫（回避）", text: "自分からはなるべく言わないようにし、相手が話すようにし向け、返答だけで済むようにする。" },
      { id: 53, cat: "工夫（回避）", text: "詰まりそうな時は言わないことがある。" },
      { id: 54, cat: "工夫（回避）", text: "笑われそうな時は、言わないことがある。" },
      { id: 55, cat: "行動", text: "自分が話すことを考えることが精一杯で、相手の話を聞き漏らすことがある。" }
    ];

    // 年表方式 M・R シナリオ（⑨対立内容ベース）
    const mrScenarios = [
      { id: 1, age: "3歳", tag: "幼児期", count: 5, text: "<1>母にだっことねだる場面\n<2>母にだっこと言っている。\n<3>母はだっこして家の中をあちこちと歩いている。" },
      { id: 2, age: "3歳", tag: "幼児期", count: 10, text: "<1>父（母）に本を読んでもらっている場面\n<2>自分が思ったことを沢山言い、質問もしている。\n<3>父（母）は嬉しそうにニコニコして答えてくれている。" },
      { id: 3, age: "4－6歳", tag: "幼児期", count: 5, text: "<1>母から手伝ってと言われた場面\n<2>今TVが良いところだから嫌という。\n<3>母はじゃ良いよといった。" },
      { id: 4, age: "4－6歳", tag: "幼児期", count: 5, text: "<1>店で母に買ってくれとねだっている場面\n<2>母に○○と○○を買ってと言っている。\n<3>母はニコニコして全部いいよと受け入れてくれている。" },
      { id: 5, age: "4－6歳", tag: "幼児期", count: 5, text: "<1>家で用事をしている母に話す場面\n<2>一緒に遊ぼうと自分のペースで(母)を誘っている。\n<3>(母)はニコニコして、すぐ一緒に遊び始める。" },
      { id: 6, age: "7－9歳", tag: "学童期", count: 5, text: "<1>学校で友達と遊んでいる場面\n<2>遊びに誘ったり、ルールを説明したり、自分のペースで気軽に話したりしている。\n<3>みんなで楽しく遊んでいる。" },
      { id: 7, age: "7－9歳", tag: "学童期", count: 5, text: "<1>教室で休み時間に数人が集まってワイワイやっている場面\n<2>自分から輪の中に入り、話しを聞き、質問に答え、話題を提供したり、質問したりしている。\n<3>皆が楽しんでいる。" },
      { id: 8, age: "10-11歳", tag: "学童期", count: 5, text: "<1>クラスで自己紹介している場面\n<2>自分の番が回ってくるまで周囲を良く観察してまっている。" },
      { id: 9, age: "10-11歳", tag: "学童期", count: 5, text: "<1>自己紹介で自分の番が回ってきた場面\n<2>周囲を良く観察しながら、自分のペースで自己紹介をしている。\n<3>周囲から拍手で受け入れられた。" },
      { id: 10, age: "12歳", tag: "思春期・成人期", count: 5, text: "<1>登下校時にクラスメイトと歩いている場面\n<2>クラスメイトに勉強や遊びの事などを自分のペースで気楽に話したり、相手の話を聞いたりしている。\n<3>皆が楽しんでいる。" },
      { id: 11, age: "15歳", tag: "思春期・成人期", count: 5, text: "<1>授業中に先生から当てられて答える場面\n<2>立って正しい答を自分のペースで答えている。\n<3>先生から良くできたとほめられた。" },
      { id: 12, age: "17歳", tag: "思春期・成人期", count: 5, text: "<1>休み時間にクラスメイトと話す場面\n<2>クラスメイトに勉強や遊びの事などを自分のペースで気楽に話したり、相手の話を聞いたりしている。\n<3>皆が楽しんでいる。" },
      { id: 13, age: "17歳", tag: "思春期・成人期", count: 5, text: "<1>授業で当てられる順番を待っている場面\n<2>教室や先生の様子を良く観察して待っており、順番が来て当てられたら、立って正しい答を自分のペースで答えている。\n<3>先生から良くできたとほめられた。" }
    ];

    // 各ステップの「さくら先生」ガイドメッセージ
    const sakuraSpeech = {
      1: "こんにちは！お名前やご家族の普段の呼び名を教えてください。あなた専用にカスタマイズされた伴走メニューを自動合成します。",
      2: "普段感じている、こころとお話し方のバランス（悪循環パターン）を1問ずつ教えてください。スマホでの文字潰れや不自然な改行は起きませんので、リラックスしてタップしてくださいね。",
      3: "チェックお疲れ様でした。あなたのお話しパターンの個性・特徴が見えてきました。身構えが起きるメカニズムを解説しますね。",
      4: "吃音のメカニズムを正しく知る「吃音教育」のステップです。中核症状と工夫・回避の違いを理解し、お話しが自動的に滑らかに流れる理由を学びましょう。",
      5: "悪循環（吃音者意識）を減らすことと並んで大切な「注意転換（シフト）」の練習です。今日起きた心のモヤモヤから注意をそらせたかチェックしましょう。",
      6: "リハーサル（M・R法）の目的と進め方を説明します。過去の身構えた経験を「自分目線のイメージ」で大成功体験に塗り替えていく非常に有効な訓練です。",
      7: "M・R法に入る前に、お腹や体の力を抜く「リラクセーション」と、静かな砂浜や青空を思い浮かべる「中性イメージ」を音声ガイドで体験しましょう。",
      8: "【幼児期（3〜6歳）】のメンタルリハーサルを始めます。親御さんの呼び方があなた専用に調整されています。各回数を終えたらボタンを押して記録しましょう！",
      9: "【学童期（7〜11歳）】のリハーサルです。学校や教室で、周囲を穏やかに見つめながら、ご自身の気楽なペースで話して成功している景色を描きます。",
      10: "【思春期・成人期（12〜17歳）】です。複雑な電話や当てられる場面の身構えをすっかり脱感作（リセット）していきます。ここを終えればゴールは目の前です！",
      11: "伴走プログラムをすべて修了しました！素晴らしい継続ですね。これからは肩の力を抜き、あなた本来の自然な話し方で、のびのびと日常を歩んでいってくださいね。🌸"
    };

    // 初回読み込み
    window.onload = function() {
      // 進行記録ゼロクリア
      mrScenarios.forEach(scen => {
        state.mrProgress[scen.id] = 0;
      });
      renderStep();
    };

    // ステップ描画メイン処理
    function renderStep() {
      const stepContainer = document.getElementById('step-content');
      const bubble = document.getElementById('sakura-bubble');
      const progressText = document.getElementById('roadmap-progress');
      const roadmapLine = document.getElementById('roadmap-line');

      // ナビゲーションおよび進捗バー更新
      progressText.innerText = `Step ${state.currentStep} / 11`;
      bubble.innerText = sakuraSpeech[state.currentStep];
      roadmapLine.style.width = `${((state.currentStep - 1) / 10) * 100}%`;

      // 上部インジケータードットの表示更新
      for (let i = 1; i <= 11; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < state.currentStep) {
          dot.className = "w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center text-[10px] font-black z-10 border border-rose-500 shadow-xs";
          dot.innerHTML = "✓";
        } else if (i === state.currentStep) {
          dot.className = "w-6 h-6 rounded-full bg-white text-rose-500 flex items-center justify-center text-[10px] font-black z-10 border-2 border-rose-400 scale-115 shadow-sm ring-4 ring-rose-100";
          dot.innerHTML = String(i);
        } else {
          dot.className = "w-6 h-6 rounded-full bg-white text-slate-400 flex items-center justify-center text-[10px] font-medium z-10 border border-slate-200";
          dot.innerHTML = String(i);
        }
      }

      // ナビボタンの基本状態
      document.getElementById('btn-back').disabled = (state.currentStep === 1);
      document.getElementById('btn-next').disabled = false;
      document.getElementById('btn-next').innerText = "次に進む";

      // 音声シミュレーター強制リセット（ステップ7以外）
      if (state.currentStep !== 7) {
        clearInterval(state.audioInterval);
        state.audioPlaying = false;
        state.audioTime = 0;
      }

      // ステップごとの動的コンテンツ挿入
      let html = "";

      switch (state.currentStep) {
        case 1:
          // --- STEP 1: 問診と呼称確認 ---
          html = `
            <div class="space-y-4">
              <h2 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2 flex items-center gap-1.5">
                <span>📋</span> 1. お話しカルテの作成
              </h2>
              <div class="space-y-3">
                <div>

        state.currentQuestionIndex--;

        state.currentQuestionIndex = 2;

    // 診断ロジック
    function runDiagnostic() {
      let kufuSum = 0, kufuCount = 0;
      let kaihiSum = 0, kaihiCount = 0;
      let emoSum = 0, emoCount = 0;

      allQuestions.forEach(q => {
        const score = state.answers[q.id] || 0;
        if (q.cat.includes("工夫") && !q.cat.includes("回避")) {
          kufuSum += score;
          kufuCount++;
        }
        if (q.cat.includes("回避")) {
          kaihiSum += score;
          kaihiCount++;
        }
        if (q.cat.includes("感情")) {
          emoSum += score;
          emoCount++;
        }
      });

      const kufuAvg = kufuCount > 0 ? Math.round(kufuSum / kufuCount) : 0;
      const kaihiAvg = kaihiCount > 0 ? Math.round(kaihiSum / kaihiCount) : 0;
      const emoAvg = emoCount > 0 ? Math.round(emoSum / emoCount) : 0;

      // 各臨床指標と自己調査努力度から特定
      let stage = "";
      let explanation = "";

      if (kaihiAvg >= 30) {
        stage = "第4層（身構え・お話し回避が強い段階）";
        explanation = "お話しすることそのものを避けたり、特定の音・ことばから徹底して言い換える『回避行動』が定着しています。吃音への予期不安が非常に強く、心身の身構えが慢性化しています。RASSのアプローチによって、回避のプレッシャーを優しく解き放ち、幼児期の気楽な発話感覚へ脱感作することが最も優先されます。焦る必要は一切ありませんよ。";
      } else if (kufuAvg >= 30) {
        stage = "第3層（お話しを意識的に制御しようとする段階）";
        explanation = "言葉を無理に押し出そうとしたり、言葉の前にえーとなどを挟む『工夫・コントロール』が多く現れています。『上手く話そう』と意図的に構音器官を動かそうとすることで、逆に発声の自動化がブロックされています。工夫を手放し、脳に本来備わっている「自然で無意識な発話」を呼び起こすリハーサル法（M・R）が絶大な効果を示します。";
      } else if (emoAvg >= 30) {
        stage = "第2層（吃音への強い自覚・予期不安の移行期）";
        explanation = "お話しすることへの部分的な不安や、吃った後の悔しさ、吃音者としての強い自覚が高まっています。工夫や回避といった二次的行動はまだ定着していませんが、不安や吃音への過剰な「注目・監視」がこの先の身構えを誘発しやすくなっています。M・R法で成功記憶を頭の中に上書きしていきましょう。";
      } else {
        stage = "第1層・正常域（中核症状中心の自然な段階）";
        explanation = "繰り返しや引き伸ばしといった軽度の中核症状のみで、お話しに対する過剰な工夫や回避、強い苦悩には至っていません。当事者本来の自然な話し方に非常に近く、心配しすぎる必要はありません。RASSを片輪として行うことで、今のうちに吃音の悪化要因を防ぐことができます。";
      }

      return {
        stage: stage,
        explanation: explanation,
        kufu: kufuAvg,
        kaihi: kaihiAvg,
        emo: emoAvg
      };
    }

    // M・R法（メンタルリハーサル）実践ブロック生成
    function renderMRStage(targetTags) {
      // 指定されたタグ（幼児期・学童期・思春期など）に合致するシナリオを取得
      const filterScen = mrScenarios.filter(s => targetTags.includes(s.tag));

      let allCleared = true;

      const listHtml = filterScen.map(s => {
        const currentCount = state.mrProgress[s.id] || 0;
        const isScenCleared = currentCount >= s.count;
        if (!isScenCleared) allCleared = false;

        // 家族の呼び名の置換
        let personalText = s.text;
        personalText = personalText.replace(/母|お母さん/g, state.profile.motherName);
        personalText = personalText.replace(/父|お父さん/g, state.profile.fatherName);

        // 回数達成ボタンの出力
        let circleBtnsHtml = "";
        for (let i = 1; i <= s.count; i++) {
          const isChecked = i <= currentCount;
          circleBtnsHtml += `
            <button onclick="toggleScenCount(${s.id}, ${i})" class="w-6 h-6 rounded-full text-[9px] font-black transition-all flex items-center justify-center ${isChecked ? 'bg-rose-500 text-white shadow-xs' : 'bg-slate-100 text-slate-400 border border-slate-200'}" style="font-family: monospace;">
              ${i}
            </button>
          `;
        }

        return `
          <div class="bg-slate-50/70 p-3.5 rounded-2xl border border-slate-200/50 space-y-2 text-xs">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-bold text-rose-500 bg-rose-50 px-2 py-0.5 rounded-sm">No.${s.id} [対象：${s.age}]</span>
              <span class="text-[10px] font-bold ${isScenCleared ? 'text-green-600' : 'text-slate-400'}">
                ${isScenCleared ? '✓ 達成' : `必要数: ${currentCount}/${s.count}回`}
              </span>
            </div>
            <p class="text-slate-700 leading-relaxed bg-white p-2.5 rounded-xl border border-slate-100 whitespace-pre-wrap font-medium">${personalText}</p>
            <div class="flex items-center justify-end gap-1.5 pt-1">
              <span class="text-[9px] font-bold text-slate-400 mr-1">実施記録：</span>
              ${circleBtnsHtml}
            </div>
          </div>
        `;
      }).join('');

      // すべて完了（クリア）するまで次に進むを無効化
      document.getElementById('btn-next').disabled = !allCleared;

      return `
        <div class="flex flex-col h-full justify-between min-h-[380px]">
          <div>
            <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-3">
              <h2 class="text-sm font-bold text-slate-800">M・R法：${targetTags[0]}編</h2>
              ${targetTags.includes("学童期") || targetTags.includes("思春期・成人期") ? `
                <button onclick="state.currentStep=7;renderStep();" class="text-[10px] font-bold text-rose-500 bg-rose-50 border border-rose-100 px-2 py-1 rounded-lg">🧘 音声ガイド</button>
              ` : ''}
            </div>
            
            <div class="space-y-3.5 max-h-[260px] overflow-y-auto pr-1 no-scrollbar">
              ${listHtml}
            </div>
          </div>
          ${!allCleared ? `
            <p class="text-[10px] text-center font-bold text-rose-500 bg-rose-50 rounded-xl p-2.5 mt-2">⚠️ 各シナリオの回数をすべて達成すると、ロックが外れます</p>
          ` : ''}
        </div>
      `;
    }

    // M・R法回数カウント操作
    function toggleScenCount(scenId, idx) {
      const current = state.mrProgress[scenId] || 0;
      if (current === idx) {
        state.mrProgress[scenId] = idx - 1;
      } else {
        state.mrProgress[scenId] = idx;
      }
      renderStep();
    }

    // STEP 7: 音声ガイドの描画
    function renderAudioPlayer() {
      const minutes = Math.floor(state.audioTime / 60);
      const seconds = state.audioTime % 60;
      const progressPercent = (state.audioTime / 60) * 100;

      // 時間ごとの連動字幕テキスト
      let subtitles = "目を静かに閉じ、椅子の背もたれに体をゆだねていきましょう。";
      if (state.audioTime > 10) subtitles = "鼻からゆっくり温かい空気を吸い込み、口からふーーっと細く長く吐き出します...";
      if (state.audioTime > 25) subtitles = "頭の中で、誰もいない静かな砂浜や青空をイメージしてください。必ず【主観的（自分目線）】な景色にしてくださいね。";
      if (state.audioTime > 45) subtitles = "雑念が浮かんだら、戦おうとせず、そっと砂浜の景色に意識を戻します...";
      if (state.audioTime >= 60) subtitles = "素晴らしいリラックス状態です。準備が整いました。次のステップへ進みましょう。";

      return `
        <div class="space-y-4">
          <h2 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2 flex items-center gap-1.5">
            <span>🧘</span> 7. リラクセーション＆中性イメージ
          </h2>
          
          <!-- 音声プレイヤー風グラフィック -->
          <div class="bg-slate-900 rounded-2xl p-5 text-white flex flex-col items-center justify-center space-y-4 shadow-inner">
            
            <!-- 波形アニメーション -->
            <div class="flex items-center justify-center gap-1 h-10 w-full max-w-[200px]">
              ${[1,2,3,4,5,6,7].map(() => `
                <div class="w-1.5 bg-rose-400 rounded-full h-full wave-bar" style="${state.audioPlaying ? '' : 'animation: none; transform: scaleY(0.2);'}"></div>
              `).join('')}
            </div>

            <!-- 時間カウント表示 -->
            <div class="text-xs font-mono font-bold text-slate-400">
              ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')} / 01:00
            </div>

            <!-- 擬似再生バー -->
            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
              <div class="bg-rose-400 h-full transition-all duration-300" style="width: ${progressPercent}%;"></div>
            </div>

            <!-- 再生制御 -->
            <button onclick="controlAudio()" class="w-12 h-14 rounded-full bg-rose-500 hover:bg-rose-600 active:scale-95 transition flex items-center justify-center shadow-lg shadow-rose-500/20 text-sm font-black">
              ${state.audioPlaying ? '一時停止' : '再生'}
            </button>
          </div>

          <!-- 字幕エリア -->
          <div class="p-3.5 bg-slate-50 border border-slate-200/50 rounded-2xl text-center min-h-[64px] flex items-center justify-center">
            <p class="text-[11px] text-slate-700 leading-relaxed font-semibold">${subtitles}</p>
          </div>
        </div>
      `;
    }

    // 音声擬似再生処理
    function controlAudio() {
      if (state.audioPlaying) {
        clearInterval(state.audioInterval);
        state.audioPlaying = false;
      } else {
        state.audioPlaying = true;
        state.audioInterval = setInterval(() => {
          state.audioTime++;
          if (state.audioTime >= 60) {
            clearInterval(state.audioInterval);
            state.audioPlaying = false;
            showModal("練習完了", "素晴らしいリラクセーション体験でした。雑念をコントロールし、自分目線のイメージを意識できましたか？問題なければ『次に進む』をタップしてください。");
          }
          renderStep();
        }, 1000);
      }
      renderStep();
    }

    // カスタムモーダルの制御
    function showModal(title, msg) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-message').innerText = msg;
      document.getElementById('custom-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('custom-modal').classList.add('hidden');
    }

    // ナビゲーション：次へ
    function nextStep() {
      if (state.currentStep === 1) {
        // Step 1での簡単な未入力バリデーション（優しいポップアップ）
        if (!state.profile.name || !state.profile.age) {
          showModal("プロフィール設定", "お名前とご年齢を簡単に入力していただくと、よりあなたに合った伴走アドバイスができますよ。🌸");
          return;
        }
      }

      if (state.currentStep < 11) {
        state.currentStep++;
        renderStep();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        // 最初に戻ってリセット
        state.currentStep = 1;
        state.currentQuestionIndex = 0;
        state.answers = {};
        state.attentionShiftChecked = [false, false, false, false];
        mrScenarios.forEach(scen => state.mrProgress[scen.id] = 0);
        renderStep();
      }
    }

    // ナビゲーション：戻る
    function prevStep() {
      if (state.currentStep > 1) {
        state.currentStep--;
        // 悪循環カードインデックスの調整
        if (state.currentStep === 2) {
          state.currentQuestionIndex = 0; // 最初から再チェック
        }
        renderStep();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }
  </script>
</body>
</html>
