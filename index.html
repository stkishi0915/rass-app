/* ------------------------------------------------------------
   HTMLエスケープ
   ユーザー入力をinnerHTMLへ挿入する場合の安全対策
   ------------------------------------------------------------ */

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ------------------------------------------------------------
   スライド表示
   ------------------------------------------------------------ */

function updateSlideDisplay() {

    const titleElement = document.getElementById('slide-title');
    const textElement = document.getElementById('slide-text');
    const pageElement = document.getElementById('slide-page');
    const prevButton = document.getElementById('prev-btn');
    const nextButton = document.getElementById('next-btn');

    if (!titleElement || !textElement) return;

    if (currentSlides.length === 0) return;

    if (currentSlideIndex < 0) {
        currentSlideIndex = 0;
    }

    if (currentSlideIndex >= currentSlides.length) {
        currentSlideIndex = currentSlides.length - 1;
    }

    const slide = currentSlides[currentSlideIndex];

    titleElement.innerText = slide.title;
    textElement.innerText = slide.text;

    if (pageElement) {
        pageElement.innerText =
            `${currentSlideIndex + 1} / ${currentSlides.length}`;
    }

    if (prevButton) {
        prevButton.disabled = (currentSlideIndex === 0);
    }

    if (nextButton) {
        nextButton.disabled =
            (currentSlideIndex === currentSlides.length - 1);
    }
}


function nextSlide() {

    if (currentSlideIndex < currentSlides.length - 1) {
        currentSlideIndex++;
        updateSlideDisplay();
    }
}


function prevSlide() {

    if (currentSlideIndex > 0) {
        currentSlideIndex--;
        updateSlideDisplay();
    }
}

/* ------------------------------------------------------------
   スコア履歴
   ------------------------------------------------------------ */

function getSavedScoreHistory() {

    try {

        const history = localStorage.getItem('rass_score_history');

        if (!history) {
            return [];
        }

        const parsed = JSON.parse(history);

        return Array.isArray(parsed) ? parsed : [];

    } catch (error) {

        console.warn(
            "スコア履歴の読み込みに失敗しました。",
            error
        );

        return [];
    }
}


function saveScoreToHistory(stepVal, scoreTotal) {

    const history = getSavedScoreHistory();

    const timestamp =
        new Date().toLocaleDateString('ja-JP');

    history.push({
        step: String(stepVal),
        total: Number(scoreTotal),
        date: timestamp
    });

    try {

        localStorage.setItem(
            'rass_score_history',
            JSON.stringify(history)
        );

    } catch (error) {

        console.warn(
            "スコア履歴の保存に失敗しました。",
            error
        );
    }

    return history;
}


/* ------------------------------------------------------------
   同一ステップの直近スコアを取得
   ------------------------------------------------------------ */

function getPreviousScoreForSameStep(history, stepVal) {

    const normalizedStep = String(stepVal);

    for (let i = history.length - 1; i >= 0; i--) {

        if (
            history[i] &&
            String(history[i].step) === normalizedStep
        ) {
            return history[i];
        }
    }

    return null;
}

                "このステップでは、まず注意シフトの体験と仕組みの理解を行います。対立内容の作成やメンタルリハーサルは、この段階では行いません。";

        } else if (sVal >= "4" && sVal <= "14") {

            homeworkBox.innerHTML =
                `ステップ ${escapeHtml(sVal)} の担当内容を用いて、一日1回を目安にセルフケア・トレーニングを継続してください。次回はチェックシートで状態の変化を振り返ります。`;

        } else if (sVal === "15") {

            homeworkBox.innerHTML =
                "現在の生活で必要となる対立内容を自分で考えるための教育フェーズです。無理に作成せず、必要に応じてAIの支援を利用してください。";
        }
    }


    /* ========================================================
       STEP 2
       ======================================================== */

    if (sVal === "2") {

        if (slideSectionTitle) {
            slideSectionTitle.innerText =
                "臨床参考資料・セルフチェック";
        }

        currentSlideIndex = 4;

        updateSlideDisplay();

        return;
    }


    /* ========================================================
       STEP 3
       ======================================================== */

    if (sVal === "3") {

        if (slideSectionTitle) {
            slideSectionTitle.innerText =
                "臨床参考資料・仕組みの理解";
        }

        /* P11を表示 */
        currentSlideIndex = 10;

        updateSlideDisplay();

        return;
    }
}

        return Number.isFinite(value)
            ? value
            : 0;
    };


    const valValue = getValue('value');
    const valCognition = getValue('cognition');
    const valEmotion = getValue('emotion');
    const valAttention = getValue('attention');
    const valEffort = getValue('effort');
    const valAvoid = getValue('avoid');
    const valAvoidAct = getValue('avoid-act');
    const valListenBurden = getValue('listen-burden');
    const valNegBias = getValue('neg-bias');

        valValue,

        valEmotion,
        valAttention,
        valEffort,
        valAvoid,
        valAvoidAct,
        valListenBurden,

    ];

        Math.round(
            values.reduce(
